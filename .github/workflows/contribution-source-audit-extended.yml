name: Extended contribution source audit
on:
  push:
    branches: [contributions/2026-09-29-verified-fixes]
    paths: [.github/workflows/contribution-source-audit-extended.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve the previous verified snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-source-audit
          run-id: 36512304655
          github-token: ${{ github.token }}
          path: previous
      - name: Extend public snapshots without executing upstream code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor
          data = json.loads(Path('previous/public-source-audit.json').read_text())
          additional = ['langgenius/dify', 'bytedance/deer-flow', 'assafelovic/gpt-researcher',
            'mannaandpoem/OpenManus', 'HKUDS/LightRAG', 'infiniflow/ragflow',
            'oobabooga/text-generation-webui', 'comfyanonymous/ComfyUI',
            'AUTOMATIC1111/stable-diffusion-webui', 'Invoke-ai/InvokeAI',
            'langchain-ai/langchain', 'Significant-Gravitas/AutoGPT', 'microsoft/semantic-kernel',
            'FoundationAgents/MetaGPT', 'OpenBMB/ChatDev', 'microsoft/TaskWeaver',
            'deepset-ai/haystack', 'zilliztech/GPTCache', 'chroma-core/chroma',
            'karpathy/nanoGPT', 'karpathy/minGPT', 'rasbt/LLMs-from-scratch',
            'rasbt/mlxtend', 'lucidrains/vit-pytorch', 'lucidrains/denoising-diffusion-pytorch']
          headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'contribution-source-audit', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']}
          def api(path):
            req = urllib.request.Request('https://api.github.com/' + path, headers=headers)
            with urllib.request.urlopen(req, timeout=20) as response:
              raw = response.read(12000001)
            if len(raw) > 12000000: raise ValueError('API response exceeds audit limit')
            return json.loads(raw)
          def rawfile(repo, commit, path):
            url = 'https://raw.githubusercontent.com/' + repo + '/' + quote(commit, safe='') + '/' + quote(path, safe='/')
            req = urllib.request.Request(url, headers={'User-Agent': 'contribution-source-audit'})
            with urllib.request.urlopen(req, timeout=20) as response:
              raw = response.read(120001)
            if len(raw) > 120000: raise ValueError('source exceeds audit limit')
            sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
            return {'path': path, 'sha': sha, 'text': raw.decode('utf-8'), 'source_url': url}
          def policy_path(p):
            low = p.lower(); name = low.rsplit('/', 1)[-1]
            return ('/' not in p and name.startswith(('readme','contributing','code_of_conduct','agents.','claude.'))) or 'issue_template' in low or 'pull_request_template' in low or ('contribut' in name and low.endswith(('.md','.rst','.txt')))
          def collect_new(repo):
            out = {'repo':repo,'policies':[],'sources':[],'errors':[],'licenses':[]}
            try:
              m = api('repos/' + repo)
              out.update(stars=m['stargazers_count'],archived=m['archived'],branch=m['default_branch'],pushed_at=m['pushed_at'])
              if m['private'] or m['archived'] or m['stargazers_count'] < 5000:
                out['selection']='excluded-by-public-active-star-filter'; return out
              out['commit']=api('repos/'+repo+'/git/ref/heads/'+quote(m['default_branch'],safe='/'))['object']['sha']
              tree=api('repos/'+repo+'/git/trees/'+out['commit']+'?recursive=1')
              entries=[x for x in tree['tree'] if x['type']=='blob']
              out['tree_truncated']=tree.get('truncated',False)
              out['root_paths']=[x['path'] for x in entries if '/' not in x['path']]
              candidates=sorted([x for x in entries if policy_path(x['path']) and x.get('size',0)<=100000],key=lambda x:(x['path'].count('/'),x['path']))
              out['policy_paths_found']=[x['path'] for x in candidates]
              out['policy_selection_truncated']=len(candidates)>30
              for x in candidates[:30]:
                try:
                  f=rawfile(repo,out['commit'],x['path'])
                  if f['sha']!=x['sha']: raise ValueError('Git blob identity mismatch')
                  out['policies'].append(f)
                except Exception as exc: out['errors'].append(x['path']+': '+str(exc))
              out['python_paths']=[x['path'] for x in entries if x['path'].endswith('.py') and 250<=x.get('size',0)<=90000 and not any(t in x['path'].lower() for t in ['test','example','tutorial','/docs/','setup.py','__init__.py'])]
              out['selection']='manual-policy-and-source-review-required'
            except Exception as exc: out['errors'].append(str(exc))
            return out
          with ThreadPoolExecutor(max_workers=3) as pool:
            data += list(pool.map(collect_new,additional))
          def extend(r):
            if not r.get('commit'): return r
            repo=r['repo']; commit=r['commit']; r.setdefault('licenses',[])
            for p in r.get('root_paths',[]):
              if p.lower().startswith(('license','licence','notice','copying')):
                try: r['licenses'].append(rawfile(repo,commit,p))
                except Exception as exc: r['errors'].append(p+': '+str(exc))
            known={f['path'] for f in r['sources']}
            paths=[p for p in r.get('python_paths',[]) if p not in known and not any(t in p.lower() for t in ['__init__.py','/e2e','/continuous_integration/','/version.py'])]
            def rank(p):
              low=p.lower()
              return (-sum(t in low for t in ['util','metric','functional','distance','chunk','normaliz','tokeniz','score','filter']),p.count('/'),low)
            count=0
            for p in sorted(paths,key=rank):
              if count>=14: break
              try:
                f=rawfile(repo,commit,p)
                if len(f['text'])<350: continue
                r['sources'].append(f); count+=1
              except Exception as exc: r['errors'].append(p+': '+str(exc))
            print(repo,r.get('stars'),len(r['policies']),len(r['sources']),len(r['licenses']),flush=True)
            return r
          with ThreadPoolExecutor(max_workers=3) as pool:
            data=list(pool.map(extend,data))
          owners=sorted(set(r['repo'].split('/')[0] for r in data if r.get('commit')))
          def inherited(owner):
            out={'owner':owner,'files':[]}
            for branch in ['main','master']:
              for p in ['CONTRIBUTING.md','CODE_OF_CONDUCT.md','PULL_REQUEST_TEMPLATE.md','.github/CONTRIBUTING.md']:
                try:
                  f=rawfile(owner+'/.github',branch,p)
                  if not any(x['sha']==f['sha'] for x in out['files']): out['files'].append(f)
                except urllib.error.HTTPError as exc:
                  if exc.code!=404: out.setdefault('errors',[]).append(str(exc))
                except Exception as exc: out.setdefault('errors',[]).append(str(exc))
            return out
          with ThreadPoolExecutor(max_workers=3) as pool:
            inherited_rules=list(pool.map(inherited,owners))
          Path('public-source-audit-extended.json').write_text(json.dumps({'repositories':data,'inherited_policies':inherited_rules},ensure_ascii=False),encoding='utf-8')
          print('Completed public source collection. No upstream code executed.')
          PY
      - name: Upload temporary extended snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-audit-extended
          path: public-source-audit-extended.json
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
