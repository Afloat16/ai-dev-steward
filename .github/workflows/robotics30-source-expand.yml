name: Expand pinned public contribution sources

on:
  push:
    branches: [contrib/robotics30-20260928]
    paths: [.github/workflows/robotics30-source-expand.yml]

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve the previously verified public snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: robotics30-public-source-snapshot
          path: public-snapshot
          repository: Afloat16/ai-dev-steward
          run-id: 36430426009
          github-token: ${{ github.token }}
      - name: Download additional pinned Python source and tests without execution
        shell: bash
        run: |
          timeout 600 python3 - <<'PY'
          import concurrent.futures as cf
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          root = pathlib.Path('public-snapshot')
          records = json.loads((root / 'repositories.json').read_text())
          old = json.loads((root / 'file-results.json').read_text())
          seen = {(x['repository'], x['path']) for x in old if x['status'] == 'verified'}
          tasks = []
          exclusions = {'third_party', 'thirdparty', '3rdparty', 'vendor', 'external', 'dependencies', 'submodules', '.git'}
          for record in records:
              if record['status'] != 'inspected':
                  continue
              repo, sha = record['full_name'], record['commit_sha']
              base = root / 'repositories' / repo
              tree = json.loads((base / '_tree.json').read_text())
              chosen = []
              for entry in tree['tree']:
                  if entry['type'] != 'blob' or entry.get('mode') == '120000' or entry.get('size', 0) > 250000:
                      continue
                  path = pathlib.PurePosixPath(entry['path'])
                  if path.is_absolute() or '..' in path.parts or any(part.lower() in exclusions for part in path.parts):
                      continue
                  name = path.name.lower()
                  if path.suffix == '.py' or name in ('pyproject.toml', 'setup.cfg', 'pytest.ini', 'tox.ini', '.pre-commit-config.yaml') or (name.startswith('requirements') and name.endswith('.txt')):
                      chosen.append(entry)
              chosen.sort(key=lambda e: ('examples' in e['path'].split('/'), len(e['path'].split('/')), e['path']))
              record['expanded_selected_count'] = min(len(chosen), 500)
              record['expanded_candidate_count'] = len(chosen)
              for entry in chosen[:500]:
                  if (repo, entry['path']) not in seen:
                      tasks.append((repo, sha, entry, base))
          (root / 'repositories.json').write_text(json.dumps(records, indent=2) + '\n')

          def get(task):
              repo, sha, entry, base = task
              result = {'repository': repo, 'commit_sha': sha, 'path': entry['path'], 'blob_sha': entry['sha']}
              try:
                  url = 'https://raw.githubusercontent.com/' + repo + '/' + sha + '/' + urllib.parse.quote(entry['path'], safe='/')
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'public-contribution-source-audit'}), timeout=30) as response:
                              data = response.read(250001)
                          break
                      except urllib.error.HTTPError as error:
                          if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                              raise
                          time.sleep(2 ** attempt)
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if actual != entry['sha']:
                      raise ValueError('Git blob SHA mismatch')
                  data.decode('utf-8')
                  target = base / 'files' / pathlib.PurePosixPath(entry['path'])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  result.update(status='verified', bytes=len(data), local_path=str(target.relative_to(root)))
              except Exception as error:
                  result.update(status='read_error', error=str(error))
              return result

          results = old[:]
          with cf.ThreadPoolExecutor(max_workers=8) as pool:
              for i, result in enumerate(pool.map(get, tasks), 1):
                  results.append(result)
                  if i % 100 == 0:
                      (root / 'file-results.json').write_text(json.dumps(results, indent=2) + '\n')
                      print('Completed additional files:', i, '/', len(tasks), flush=True)
          (root / 'file-results.json').write_text(json.dumps(results, indent=2) + '\n')
          summary = {'repositories': len(records), 'file_requests': len(results), 'verified_files': sum(x['status'] == 'verified' for x in results), 'errors': sum(x['status'] != 'verified' for x in results), 'executed_upstream_code': False, 'published_upstream_issues_or_prs': False}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary), flush=True)
          PY
      - name: Preserve expanded public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robotics30-public-source-expanded
          path: public-snapshot/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
