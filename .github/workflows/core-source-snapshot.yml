name: Core source snapshot
on:
  push:
    branches: ['contributions/2026-09-29-core-correctness']
    paths: ['.github/workflows/core-source-snapshot.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read public source files without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.request, urllib.parse
          targets = {
            'unclecode/crawl4ai': ('develop', ['crawl4ai/deep_crawling/scorers.py', 'crawl4ai/deep_crawling/filters.py', 'crawl4ai/deep_crawling/bfs_strategy.py', 'crawl4ai/deep_crawling/bff_strategy.py', 'crawl4ai/deep_crawling/base_strategy.py', 'CONTRIBUTING.md', 'LICENSE']),
            'hiyouga/EasyR1': ('main', ['verl/trainer/core_algos.py', '.github/CONTRIBUTING.md']),
            'lucidrains/vit-pytorch': ('c3622978f68a114b5ae45c4322b54391b24f5c3d', ['vit_pytorch/vit.py', 'vit_pytorch/t2t.py', 'vit_pytorch/distill.py']),
          }
          def get(route):
              request=urllib.request.Request('https://api.github.com/'+route, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'bounded-source-snapshot'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          def collect(item):
              repo,(ref,paths)=item
              commit=get('repos/'+repo+'/commits/'+urllib.parse.quote(ref,safe=''))['sha']
              result={'repo':repo,'ref':ref,'commit':commit,'files':[],'errors':[]}
              for path in paths:
                  try:
                      data=get('repos/'+repo+'/contents/'+path+'?ref='+commit)
                      raw=base64.b64decode(data['content'])
                      if len(raw)>1500000: raise ValueError('file too large')
                      sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                      if sha!=data['sha']: raise ValueError('blob mismatch')
                      result['files'].append({'path':path,'sha':sha,'text':raw.decode('utf-8')})
                  except Exception as error:
                      result['errors'].append({'path':path,'error':str(error)})
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(collect,targets.items()))
          pathlib.Path('out').mkdir()
          pathlib.Path('out/sources.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf-8')
          print(json.dumps([{'repo':r['repo'],'files':len(r['files']),'errors':r['errors']} for r in results]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-source-snapshot
          path: out/sources.json
          retention-days: 1
