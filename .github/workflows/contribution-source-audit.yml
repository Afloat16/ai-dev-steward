name: Contribution source audit

on:
  push:
    branches: [contributions/2026-09-29-verified-fixes]
    paths: [.github/workflows/contribution-source-audit.yml]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect public policy and source snapshots without executing upstream code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, time, urllib.request, urllib.error
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor

          repos = [
            'eriklindernoren/ML-From-Scratch', 'ddbourgin/numpy-ml',
            'recommenders-team/recommenders', 'MaartenGr/BERTopic', 'MaartenGr/KeyBERT',
            'neuml/txtai', 'flairNLP/flair', 'nltk/nltk', 'piskvorky/gensim',
            'GeeeekExplorer/nano-vllm', 'codertimo/BERT-pytorch',
            'jadore801120/attention-is-all-you-need-pytorch', 'jessevig/bertviz',
            'sloria/TextBlob', 'stanfordnlp/stanza', 'argosopentech/argos-translate',
            'vi3k6i5/flashtext', 'hiyouga/LlamaFactory', 'hiyouga/EasyR1',
            'stanford-oval/storm', 'labmlai/annotated_deep_learning_paper_implementations',
            'roboflow/supervision', 'JaidedAI/EasyOCR', 'microsoft/qlib',
            'lukas-blecher/LaTeX-OCR', 'deeppavlov/DeepPavlov',
            'Lightning-AI/pytorch-lightning', 'optuna/optuna', 'onnx/onnx',
            'arc53/DocsGPT', 'ultralytics/ultralytics', 'streamlit/streamlit',
            'OpenBB-finance/OpenBB', 'RasaHQ/rasa', 'serengil/deepface',
            'PaddlePaddle/PaddleNLP', 'modelscope/modelscope', 'd2l-ai/d2l-en',
            'marimo-team/marimo', 'google/langextract'
          ]
          preferred = {
            'eriklindernoren/ML-From-Scratch': ['mlfromscratch/utils/data_manipulation.py'],
            'ddbourgin/numpy-ml': ['numpy_ml/utils/distance_metrics.py'],
            'recommenders-team/recommenders': ['recommenders/utils/python_utils.py'],
            'MaartenGr/BERTopic': ['bertopic/_utils.py', 'bertopic/vectorizers/_ctfidf.py'],
            'MaartenGr/KeyBERT': ['keybert/_mmr.py', 'keybert/_maxsum.py', 'keybert/_utils.py'],
            'nltk/nltk': ['nltk/metrics/distance.py', 'nltk/metrics/scores.py', 'nltk/util.py'],
            'piskvorky/gensim': ['gensim/matutils.py'],
            'GeeeekExplorer/nano-vllm': ['nanovllm/sampling_params.py', 'nanovllm/engine/sequence.py', 'nanovllm/engine/scheduler.py', 'nanovllm/engine/block_manager.py'],
            'codertimo/BERT-pytorch': ['bert_pytorch/model/embedding/position.py', 'bert_pytorch/model/utils/layer_norm.py'],
            'jadore801120/attention-is-all-you-need-pytorch': ['transformer/Models.py', 'transformer/Optim.py'],
            'jessevig/bertviz': ['bertviz/util.py'],
            'sloria/TextBlob': ['src/textblob/utils.py', 'src/textblob/formats.py'],
            'vi3k6i5/flashtext': ['flashtext/keyword.py'],
            'hiyouga/LlamaFactory': ['src/llamafactory/data/data_utils.py'],
            'hiyouga/EasyR1': ['verl/utils/py_functional.py', 'verl/utils/torch_functional.py'],
            'JaidedAI/EasyOCR': ['easyocr/utils.py'],
            'lukas-blecher/LaTeX-OCR': ['pix2tex/utils/utils.py'],
            'optuna/optuna': ['optuna/_transform.py'],
            'serengil/deepface': ['deepface/commons/distance.py', 'deepface/modules/verification.py'],
            'google/langextract': ['langextract/chunking.py', 'langextract/tokenizer.py']
          }
          headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'contribution-source-audit', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']}
          def get(path):
            url = 'https://api.github.com/' + path
            request = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(request, timeout=20) as response:
              raw = response.read(12_000_001)
            if len(raw) > 12_000_000:
              raise ValueError('response exceeds audit limit')
            return json.loads(raw)
          def blob(repo, entry):
            data = get('repos/' + repo + '/git/blobs/' + entry['sha'])
            raw = base64.b64decode(data['content'])
            actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
            if actual != entry['sha']:
              raise ValueError('blob identity mismatch')
            return {'path': entry['path'], 'sha': actual, 'text': raw.decode('utf-8')}
          def collect(repo):
            out = {'repo': repo, 'policies': [], 'sources': [], 'errors': []}
            try:
              meta = get('repos/' + repo)
              out.update(stars=meta['stargazers_count'], archived=meta['archived'], branch=meta['default_branch'], pushed_at=meta['pushed_at'])
              if meta['private'] or meta['archived'] or meta['stargazers_count'] < 5000:
                out['selection'] = 'excluded-by-public-active-star-filter'
                return out
              branch = 'staging' if repo == 'recommenders-team/recommenders' else meta['default_branch']
              from urllib.parse import quote
              ref = get('repos/' + repo + '/git/ref/heads/' + quote(branch, safe='/'))
              out['commit'] = ref['object']['sha']
              out['branch'] = branch
              tree = get('repos/' + repo + '/git/trees/' + out['commit'] + '?recursive=1')
              entries = [x for x in tree['tree'] if x['type'] == 'blob']
              out['tree_truncated'] = tree.get('truncated', False)
              bypath = {x['path']: x for x in entries}
              def is_policy(p):
                low = p.lower()
                name = low.rsplit('/', 1)[-1]
                return (('/' not in p and (name.startswith(('readme', 'contributing', 'code_of_conduct', 'agents.', 'claude.')))) or ('issue_template' in low or 'pull_request_template' in low) or ('contribut' in name and low.endswith(('.md', '.rst', '.txt'))) or ('policy' in low and any(x in low for x in ['ai', 'llm', 'agent'])))
              candidates = [x for x in entries if is_policy(x['path']) and x.get('size', 0) <= 100000]
              candidates.sort(key=lambda x: (x['path'].count('/'), x['path']))
              out['policy_paths_found'] = [x['path'] for x in candidates]
              for x in candidates[:25]:
                try: out['policies'].append(blob(repo, x))
                except Exception as exc: out['errors'].append(x['path'] + ': ' + str(exc))
              out['policy_selection_truncated'] = len(candidates) > 25
              out['root_paths'] = [x['path'] for x in entries if '/' not in x['path']]
              py = [x for x in entries if x['path'].endswith('.py') and x.get('size', 0) <= 90000 and not any(y in x['path'].lower() for y in ['test', 'example', 'tutorial', '/docs/', 'setup.py'])]
              out['python_paths'] = [x['path'] for x in py]
              def score(x):
                p = x['path'].lower()
                return (-sum(k in p for k in ['util', 'metric', 'functional', 'distance', 'chunk', 'normaliz', 'tokeniz', 'score', 'filter']), x.get('size', 0), p)
              selected = [bypath[p] for p in preferred.get(repo, []) if p in bypath]
              selected += [x for x in sorted(py, key=score) if x not in selected][:max(0, 10-len(selected))]
              for x in selected:
                try: out['sources'].append(blob(repo, x))
                except Exception as exc: out['errors'].append(x['path'] + ': ' + str(exc))
              out['selection'] = 'manual-policy-and-source-review-required'
            except Exception as exc:
              out['errors'].append(str(exc))
            print(repo, out.get('stars'), len(out['policies']), len(out['sources']), flush=True)
            return out
          with ThreadPoolExecutor(max_workers=3) as pool:
            results = list(pool.map(collect, repos))
          Path('public-source-audit.json').write_text(json.dumps(results, ensure_ascii=False), encoding='utf-8')
          print('Collected', len(results), 'repository records. No upstream code executed.')
          PY
      - name: Upload temporary audit snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-audit
          path: public-source-audit.json
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
