name: StewardCheck

on:
  push:
    paths:
      - 'tools/stewardcheck/**'
      - '.github/workflows/stewardcheck.yml'
  pull_request:
    paths:
      - 'tools/stewardcheck/**'
      - '.github/workflows/stewardcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install ./tools/stewardcheck
      - name: Unit and integration tests
        run: python -m unittest discover -s tools/stewardcheck/tests -v
      - name: Module and console entrypoints
        run: |
          python -m stewardcheck --version
          stewardcheck --help
      - name: Isolated end-to-end demonstration
        run: python tools/stewardcheck/examples/demo.py
